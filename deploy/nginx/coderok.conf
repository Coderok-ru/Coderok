server {
    listen 80;
    listen [::]:80;
    server_name coderok.ru www.coderok.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://coderok.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.coderok.ru;

    ssl_certificate /etc/letsencrypt/live/coderok.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coderok.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://coderok.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coderok.ru;

    ssl_certificate /etc/letsencrypt/live/coderok.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coderok.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/coderok/current;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;
    server_tokens off;

    access_log /var/log/nginx/coderok.access.log;
    error_log /var/log/nginx/coderok.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Keep published redirects in sync with nuxt.config.ts.
    location ~ ^/cases/mopup-excel-routes/?$ {
        return 301 https://coderok.ru/cases/zalog-chistoty-route-maps/$is_args$args;
    }

    location ^~ /_nuxt/ {
        alias /var/www/coderok/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        return 404;
    }

    # A missing route must be a real 404, never an SPA fallback to index.html.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location = /200.html {
        return 404;
    }

    location ~* \.(?:css|js|woff2?|webp|png|jpe?g|gif|ico|svg)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
