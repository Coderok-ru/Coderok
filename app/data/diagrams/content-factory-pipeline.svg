<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="content-factory-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-acc"/></marker>
    <marker id="content-factory-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
    <marker id="content-factory-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-bad"/></marker>
  </defs>

  <!-- пять участков -->
  <rect x="0" y="0" width="136" height="76" rx="10" class="d-box"/>
  <text x="14" y="22" class="d-label">1 · Источник</text>
  <text x="14" y="46" class="d-title">Данные</text>
  <text x="14" y="64" class="d-muted">каталог, CRM, PIM</text>

  <rect x="156" y="0" width="136" height="76" rx="10" class="d-box"/>
  <text x="170" y="22" class="d-label">2 · Очередь</text>
  <text x="170" y="46" class="d-title">Что обновить</text>
  <text x="170" y="64" class="d-muted">зависимые тексты</text>

  <rect x="312" y="0" width="136" height="76" rx="10" class="d-acc-box"/>
  <text x="326" y="22" class="d-label">3 · Сборка</text>
  <text x="326" y="46" class="d-title">Нейросеть</text>
  <text x="326" y="64" class="d-muted">шаблон, глоссарий</text>

  <rect x="468" y="0" width="136" height="76" rx="10" class="d-box"/>
  <text x="482" y="22" class="d-label">4 · Проверка</text>
  <text x="482" y="46" class="d-title">ОТК</text>
  <text x="482" y="64" class="d-muted">авто + редактор</text>

  <rect x="624" y="0" width="136" height="76" rx="10" class="d-good-box"/>
  <text x="638" y="22" class="d-label">5 · Выпуск</text>
  <text x="638" y="46" class="d-title">Публикация</text>
  <text x="638" y="64" class="d-muted">через API</text>

  <path d="M138 38H153" class="d-line-acc" marker-end="url(#content-factory-arrow)"/>
  <path d="M294 38H309" class="d-line-acc" marker-end="url(#content-factory-arrow)"/>
  <path d="M450 38H465" class="d-line-acc" marker-end="url(#content-factory-arrow)"/>
  <path d="M606 38H621" class="d-line-acc" marker-end="url(#content-factory-arrow)"/>

  <!-- пример зависимости -->
  <rect x="0" y="120" width="292" height="64" rx="8" class="d-box"/>
  <text x="14" y="146">Изменилась цена →</text>
  <text x="14" y="168" class="d-muted">карточка, фид, прайс; статью не трогаем</text>
  <path d="M68 78V117" class="d-line d-dash"/>

  <!-- обратная связь -->
  <rect x="468" y="120" width="136" height="64" rx="8" class="d-bad-box"/>
  <text x="482" y="146" class="d-bad">Возврат</text>
  <text x="482" y="168" class="d-muted">с причиной</text>
  <path d="M536 78V117" class="d-line-bad d-dash" marker-end="url(#content-factory-arrow-bad)"/>

  <rect x="312" y="120" width="136" height="64" rx="8" class="d-box"/>
  <text x="326" y="146">Новое правило</text>
  <text x="326" y="168" class="d-muted">шаблон, проверки</text>
  <path d="M466 152H451" class="d-line" marker-end="url(#content-factory-arrow-muted)"/>
  <path d="M380 118V79" class="d-line" marker-end="url(#content-factory-arrow-muted)"/>

  <!-- каналы -->
  <path d="M692 78V100" class="d-line"/>
  <rect x="624" y="104" width="136" height="32" rx="8" class="d-box"/>
  <text x="692" y="125" text-anchor="middle">Сайт</text>
  <rect x="624" y="144" width="136" height="32" rx="8" class="d-box"/>
  <text x="692" y="165" text-anchor="middle">Маркетплейсы</text>
  <rect x="624" y="184" width="136" height="32" rx="8" class="d-box"/>
  <text x="692" y="205" text-anchor="middle">Рассылка</text>
  <rect x="624" y="224" width="136" height="32" rx="8" class="d-box"/>
  <text x="692" y="245" text-anchor="middle">Бот поддержки</text>

  <text x="0" y="230" class="d-acc">Факты — только из источника.</text>
  <text x="0" y="252" class="d-muted">Нейросеть отвечает за формулировки, а не за цены и характеристики.</text>
</svg>
