<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="own-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-bad"/></marker>
    <marker id="own-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-good"/></marker>
  </defs>

  <!-- Облачный конструктор -->
  <text x="0" y="16" class="d-title">Тильда, Wix</text>
  <text x="0" y="36" class="d-muted">облачный конструктор</text>
  <rect x="0" y="54" width="236" height="346" rx="12" class="d-box"/>
  <text x="16" y="80" class="d-label">Платформа</text>
  <rect x="16" y="92" width="204" height="60" rx="8" class="d-bad-box"/>
  <text x="30" y="116">код сайта и сервер</text>
  <text x="30" y="136" class="d-muted">формы, корзина, кабинеты</text>
  <path d="M40 153V186" class="d-line-bad" marker-end="url(#own-arrow-bad)"/>
  <text x="50" y="174" class="d-bad d-small">отключит без оплаты</text>
  <rect x="16" y="190" width="204" height="150" rx="10" class="d-box"/>
  <text x="30" y="212" class="d-label">У вас</text>
  <rect x="28" y="224" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="40" y="243" class="d-small">домен, если он на вас</text>
  <rect x="28" y="260" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="40" y="279" class="d-small">тексты и фотографии</text>
  <rect x="28" y="296" width="180" height="28" rx="6" class="d-bad-box"/>
  <text x="40" y="315" class="d-small">экспорт: только статика</text>
  <text x="16" y="372" class="d-bad">нет подписки — нет сайта</text>

  <!-- WordPress -->
  <text x="262" y="16" class="d-title">WordPress</text>
  <text x="262" y="36" class="d-muted">открытый код + плагины</text>
  <rect x="262" y="54" width="236" height="346" rx="12" class="d-box"/>
  <text x="278" y="80" class="d-label">Чужие зависимости</text>
  <rect x="278" y="92" width="204" height="60" rx="8" class="d-box"/>
  <text x="292" y="116">тема и редактор страниц</text>
  <text x="292" y="136" class="d-muted">20–40 сторонних плагинов</text>
  <path d="M302 153V186" class="d-line-bad d-dash" marker-end="url(#own-arrow-bad)"/>
  <text x="312" y="174" class="d-bad d-small">обновления, уязвимости</text>
  <rect x="278" y="190" width="204" height="150" rx="10" class="d-box"/>
  <text x="292" y="212" class="d-label">У вас</text>
  <rect x="290" y="224" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="302" y="243" class="d-small">код на вашем сервере</text>
  <rect x="290" y="260" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="302" y="279" class="d-small">база данных</text>
  <rect x="290" y="296" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="302" y="315" class="d-small">домен и хостинг</text>
  <text x="278" y="372" class="d-muted">ваш, но держится на плагинах</text>

  <!-- Собственный код -->
  <text x="524" y="16" class="d-title">Собственный код</text>
  <text x="524" y="36" class="d-muted">репозиторий, сервер, домен</text>
  <rect x="524" y="54" width="236" height="346" rx="12" class="d-box"/>
  <text x="540" y="80" class="d-label">Подрядчик</text>
  <rect x="540" y="92" width="204" height="60" rx="8" class="d-box"/>
  <text x="554" y="116">пишет и сопровождает код</text>
  <text x="554" y="136" class="d-muted">работает по договору</text>
  <path d="M564 153V186" class="d-line-good" marker-end="url(#own-arrow-good)"/>
  <text x="574" y="174" class="d-good d-small">передаёт код и доступы</text>
  <rect x="540" y="190" width="204" height="150" rx="10" class="d-acc-box"/>
  <text x="554" y="212" class="d-label">У вас</text>
  <rect x="552" y="224" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="564" y="243" class="d-small">репозиторий с исходниками</text>
  <rect x="552" y="260" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="564" y="279" class="d-small">сервер и данные</text>
  <rect x="552" y="296" width="180" height="28" rx="6" class="d-good-box"/>
  <text x="564" y="315" class="d-small">домен</text>
  <text x="540" y="372" class="d-good">продолжит любой разработчик</text>
</svg>
