<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="audit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
    <marker id="audit-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-acc"/></marker>
  </defs>

  <!-- Пять дней по порядку: сначала то, без чего проект может исчезнуть -->
  <rect x="0" y="0" width="136" height="84" rx="10" class="d-acc-box"/>
  <text x="16" y="24" class="d-label">День 1</text>
  <text x="16" y="50" class="d-title">Доступы</text>
  <text x="16" y="69" class="d-muted">и инфраструктура</text>

  <rect x="156" y="0" width="136" height="84" rx="10" class="d-box"/>
  <text x="172" y="24" class="d-label">Дни 2–3</text>
  <text x="172" y="50" class="d-title">Код</text>
  <text x="172" y="69" class="d-muted">сборка, уязвимости</text>

  <rect x="312" y="0" width="136" height="84" rx="10" class="d-box"/>
  <text x="328" y="24" class="d-label">День 3</text>
  <text x="328" y="50" class="d-title">Данные</text>
  <text x="328" y="69" class="d-muted">база, 152-ФЗ</text>

  <rect x="468" y="0" width="136" height="84" rx="10" class="d-box"/>
  <text x="484" y="24" class="d-label">День 4</text>
  <text x="484" y="50" class="d-title">Скорость</text>
  <text x="484" y="69" class="d-muted">сервер и браузер</text>

  <rect x="624" y="0" width="136" height="84" rx="10" class="d-box"/>
  <text x="640" y="24" class="d-label">День 5</text>
  <text x="640" y="50" class="d-title">SEO</text>
  <text x="640" y="69" class="d-muted">и интеграции</text>

  <path d="M138 42H153" class="d-line" marker-end="url(#audit-arrow)"/>
  <path d="M294 42H309" class="d-line" marker-end="url(#audit-arrow)"/>
  <path d="M450 42H465" class="d-line" marker-end="url(#audit-arrow)"/>
  <path d="M606 42H621" class="d-line" marker-end="url(#audit-arrow)"/>

  <!-- Находки каждого дня стекают в общий список -->
  <path d="M68 84V124M224 84V124M380 84V124M536 84V124M692 84V124M68 124H692" class="d-line"/>
  <text x="392" y="152" class="d-small d-muted">каждая находка — в один из уровней</text>

  <path d="M116 124V169" class="d-line" marker-end="url(#audit-arrow)"/>
  <path d="M380 124V169" class="d-line" marker-end="url(#audit-arrow)"/>
  <path d="M644 124V169" class="d-line" marker-end="url(#audit-arrow)"/>

  <!-- Три уровня риска -->
  <rect x="0" y="172" width="232" height="78" rx="10" class="d-bad-box"/>
  <text x="18" y="200" class="d-title">Критично</text>
  <text x="18" y="222" class="d-bad">исправить на этой неделе</text>
  <text x="18" y="240" class="d-small d-muted">может остановить бизнес</text>

  <rect x="264" y="172" width="232" height="78" rx="10" class="d-acc-box"/>
  <text x="282" y="200" class="d-title">Важно</text>
  <text x="282" y="222" class="d-acc">в ближайший месяц</text>
  <text x="282" y="240" class="d-small d-muted">вредит, но не завтра</text>

  <rect x="528" y="172" width="232" height="78" rx="10" class="d-good-box"/>
  <text x="546" y="200" class="d-title">Можно отложить</text>
  <text x="546" y="222" class="d-good">в плановом порядке</text>
  <text x="546" y="240" class="d-small d-muted">неудобно, но не опасно</text>

  <!-- Всё сводится в отчёт -->
  <path d="M116 250V290M380 250V290M644 250V290M116 290H644" class="d-line-acc"/>
  <path d="M380 290V318" class="d-line-acc" marker-end="url(#audit-arrow-acc)"/>
  <text x="392" y="310" class="d-small d-acc">сводим</text>

  <rect x="150" y="320" width="460" height="80" rx="12" class="d-acc-box"/>
  <text x="380" y="348" text-anchor="middle" class="d-title">Отчёт простым языком</text>
  <text x="380" y="370" text-anchor="middle">чинить или переписывать</text>
  <text x="380" y="388" text-anchor="middle" class="d-muted">план работ и оценка</text>
</svg>
