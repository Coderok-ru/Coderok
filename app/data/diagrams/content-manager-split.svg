<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="content-manager-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-acc"/></marker>
    <marker id="content-manager-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-bad"/></marker>
  </defs>
  <text x="80" y="16" text-anchor="middle" class="d-label">Источник</text>
  <text x="290" y="16" text-anchor="middle" class="d-label">Нейросеть готовит</text>
  <text x="520" y="16" text-anchor="middle" class="d-label">Человек решает</text>
  <text x="700" y="16" text-anchor="middle" class="d-label">Итог</text>

  <rect x="0" y="40" width="160" height="150" rx="10" class="d-box"/>
  <text x="80" y="70" text-anchor="middle" class="d-title">Ваши данные</text>
  <text x="80" y="102" text-anchor="middle">прайс поставщика</text>
  <text x="80" y="126" text-anchor="middle">спецификации</text>
  <text x="80" y="150" text-anchor="middle">учётная система</text>
  <text x="80" y="174" text-anchor="middle" class="d-muted">сертификаты</text>

  <path d="M162 115H196" class="d-line-acc" marker-end="url(#content-manager-arrow)"/>

  <rect x="200" y="40" width="180" height="150" rx="10" class="d-box"/>
  <text x="290" y="70" text-anchor="middle" class="d-title">ИИ</text>
  <text x="290" y="102" text-anchor="middle">черновик описания</text>
  <text x="290" y="126" text-anchor="middle">поля из прайса</text>
  <text x="290" y="150" text-anchor="middle">поиск пропусков</text>
  <text x="290" y="174" text-anchor="middle" class="d-muted">ничего не публикует</text>

  <path d="M382 115H416" class="d-line-acc" marker-end="url(#content-manager-arrow)"/>

  <rect x="420" y="40" width="200" height="150" rx="10" class="d-acc-box"/>
  <text x="520" y="70" text-anchor="middle" class="d-title">Контент-менеджер</text>
  <text x="520" y="102" text-anchor="middle">сверка с документами</text>
  <text x="520" y="126" text-anchor="middle">правила площадки</text>
  <text x="520" y="150" text-anchor="middle">правка текста</text>
  <text x="520" y="174" text-anchor="middle" class="d-muted">решение о публикации</text>

  <path d="M622 115H656" class="d-line-acc" marker-end="url(#content-manager-arrow)"/>

  <rect x="660" y="80" width="100" height="70" rx="10" class="d-good-box"/>
  <text x="710" y="111" text-anchor="middle" class="d-title">Карточка</text>
  <text x="710" y="132" text-anchor="middle" class="d-muted">точная</text>

  <path d="M380 190C380 230 400 240 420 250" class="d-line-bad d-dash" marker-end="url(#content-manager-arrow-bad)"/>
  <text x="300" y="232" text-anchor="middle" class="d-bad d-small">без проверки</text>

  <rect x="420" y="230" width="340" height="80" rx="10" class="d-bad-box"/>
  <text x="436" y="258" class="d-bad">Ошибки уходят к покупателю:</text>
  <text x="436" y="280">выдуманные характеристики, мусор в названиях,</text>
  <text x="436" y="298">блокировки карточек и возвраты</text>
</svg>
