<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
    <marker id="stack-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-acc"/></marker>
  </defs>

  <text x="0" y="16" class="d-title">Как выбрать серверную часть</text>
  <text x="0" y="36" class="d-muted">от задачи и нагрузки, а не от любимого языка</text>
  <text x="470" y="36" class="d-label">Что выбираем</text>

  <!-- Старт -->
  <rect x="0" y="54" width="360" height="40" rx="20" class="d-acc-box"/>
  <text x="180" y="79" text-anchor="middle">Что строим и какая нагрузка через 2–3 года?</text>
  <path d="M40 95V117" class="d-line" marker-end="url(#stack-arrow)"/>

  <!-- Вопросы: «да» — вправо к стеку, «нет» — вниз к следующему вопросу -->
  <rect x="0" y="120" width="360" height="48" rx="10" class="d-box"/>
  <text x="16" y="149">Только контент, без кабинетов и заказов?</text>
  <rect x="0" y="196" width="360" height="48" rx="10" class="d-box"/>
  <text x="16" y="225">Высокая нагрузка, большой каталог, API?</text>
  <rect x="0" y="272" width="360" height="48" rx="10" class="d-box"/>
  <text x="16" y="301">Реальное время, рендеринг интерфейса?</text>
  <rect x="0" y="348" width="360" height="48" rx="10" class="d-box"/>
  <text x="16" y="377">Свои ML-модели, анализ данных?</text>

  <path d="M40 169V193" class="d-line" marker-end="url(#stack-arrow)"/>
  <path d="M40 245V269" class="d-line" marker-end="url(#stack-arrow)"/>
  <path d="M40 321V345" class="d-line" marker-end="url(#stack-arrow)"/>
  <path d="M40 397V421" class="d-line" marker-end="url(#stack-arrow)"/>
  <text x="50" y="186" class="d-small">нет</text>
  <text x="50" y="262" class="d-small">нет</text>
  <text x="50" y="338" class="d-small">нет</text>
  <text x="50" y="414" class="d-small">нет</text>

  <path d="M361 144H467" class="d-line" marker-end="url(#stack-arrow)"/>
  <path d="M361 220H467" class="d-line" marker-end="url(#stack-arrow)"/>
  <path d="M361 296H467" class="d-line" marker-end="url(#stack-arrow)"/>
  <path d="M361 372H467" class="d-line" marker-end="url(#stack-arrow)"/>
  <text x="414" y="138" text-anchor="middle" class="d-small">да</text>
  <text x="414" y="214" text-anchor="middle" class="d-small">да</text>
  <text x="414" y="290" text-anchor="middle" class="d-small">да</text>
  <text x="414" y="366" text-anchor="middle" class="d-small">да</text>

  <!-- Результаты -->
  <rect x="470" y="120" width="290" height="48" rx="10" class="d-box"/>
  <text x="486" y="140" class="d-title">Статика</text>
  <text x="486" y="158" class="d-muted">Nuxt в режиме генерации, HTML</text>
  <rect x="470" y="196" width="290" height="48" rx="10" class="d-box"/>
  <text x="486" y="216" class="d-title">Go</text>
  <text x="486" y="234" class="d-muted">сервисы, воркеры, Templ + HTMX</text>
  <rect x="470" y="272" width="290" height="48" rx="10" class="d-box"/>
  <text x="486" y="292" class="d-title">Node.js</text>
  <text x="486" y="310" class="d-muted">Nuxt, Next.js, WebSocket</text>
  <rect x="470" y="348" width="290" height="48" rx="10" class="d-box"/>
  <text x="486" y="368" class="d-title">Python</text>
  <text x="486" y="386" class="d-muted">машинное обучение, данные</text>

  <!-- По умолчанию -->
  <rect x="0" y="424" width="360" height="56" rx="10" class="d-acc-box"/>
  <text x="16" y="447" class="d-title">PHP · Laravel</text>
  <text x="16" y="467" class="d-muted">сайт, CRM, магазин; Filament для админки</text>

  <path d="M361 452H467" class="d-line-acc d-dash" marker-end="url(#stack-arrow-acc)"/>
  <text x="414" y="444" text-anchor="middle" class="d-acc d-small">нагрузка</text>
  <text x="414" y="470" text-anchor="middle" class="d-acc d-small">выросла</text>
  <rect x="470" y="424" width="290" height="56" rx="10" class="d-box d-dash"/>
  <text x="486" y="447" class="d-title">+ сервис на Go</text>
  <text x="486" y="467" class="d-muted">только для нагруженной части</text>
</svg>
