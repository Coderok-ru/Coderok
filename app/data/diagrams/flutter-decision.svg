<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head"/></marker>
    <marker id="fd-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-acc"/></marker>
  </defs>

  <!-- Вопрос -->
  <rect x="215" y="0" width="330" height="44" rx="10" class="d-box"/>
  <text x="380" y="27" text-anchor="middle" class="d-title">Что сервис делает в телефоне?</text>

  <!-- Ветвление -->
  <path d="M380 44V68M120 68H640" class="d-line"/>
  <path d="M120 68V128" class="d-line" marker-end="url(#fd-arrow)"/>
  <path d="M380 68V128" class="d-line-acc" marker-end="url(#fd-arrow-acc)"/>
  <path d="M640 68V128" class="d-line" marker-end="url(#fd-arrow)"/>
  <text x="128" y="102" class="d-small">графика, 3D, macOS</text>
  <text x="388" y="102" class="d-acc d-small">заказы, оплата, push</text>
  <text x="648" y="102" class="d-small">контент, кабинет</text>

  <!-- Нативно -->
  <rect x="0" y="130" width="240" height="60" rx="10" class="d-box"/>
  <text x="16" y="156" class="d-title">Нативно</text>
  <text x="16" y="176" class="d-muted">Swift и Kotlin</text>

  <rect x="0" y="222" width="110" height="38" rx="8" class="d-box"/>
  <text x="55" y="245" text-anchor="middle" class="d-muted">код iOS</text>
  <rect x="130" y="222" width="110" height="38" rx="8" class="d-box"/>
  <text x="185" y="245" text-anchor="middle" class="d-muted">код Android</text>
  <path d="M55 260V306M185 260V306" class="d-line" marker-end="url(#fd-arrow)"/>
  <text x="62" y="287" class="d-small">сборка</text>
  <text x="192" y="287" class="d-small">сборка</text>
  <rect x="0" y="308" width="110" height="36" rx="8" class="d-box"/>
  <text x="55" y="330" text-anchor="middle" class="d-small">App Store</text>
  <rect x="130" y="308" width="110" height="36" rx="8" class="d-box"/>
  <text x="185" y="330" text-anchor="middle" class="d-small">Google Play</text>
  <text x="0" y="380" class="d-bad">две кодовые базы</text>
  <text x="0" y="400" class="d-muted">каждая правка — дважды</text>

  <!-- Flutter -->
  <rect x="260" y="130" width="240" height="60" rx="10" class="d-acc-box"/>
  <text x="276" y="156" class="d-title">Flutter</text>
  <text x="276" y="176" class="d-muted">одна кодовая база на Dart</text>

  <rect x="260" y="222" width="240" height="38" rx="8" class="d-acc-box"/>
  <text x="380" y="245" text-anchor="middle" class="d-acc">один код</text>
  <path d="M380 260V284M298 284H462" class="d-line-acc"/>
  <path d="M298 284V306M380 284V306M462 284V306" class="d-line-acc" marker-end="url(#fd-arrow-acc)"/>
  <text x="388" y="278" class="d-acc d-small">сборки</text>
  <rect x="260" y="308" width="76" height="36" rx="8" class="d-box"/>
  <text x="298" y="330" text-anchor="middle" class="d-small">App Store</text>
  <rect x="342" y="308" width="76" height="36" rx="8" class="d-box"/>
  <text x="380" y="330" text-anchor="middle" class="d-small">Google Play</text>
  <rect x="424" y="308" width="76" height="36" rx="8" class="d-box"/>
  <text x="462" y="330" text-anchor="middle" class="d-small">RuStore</text>
  <text x="260" y="380" class="d-good">одна база — три стора</text>
  <text x="260" y="400" class="d-muted">нативный код только точечно</text>

  <!-- PWA -->
  <rect x="520" y="130" width="240" height="60" rx="10" class="d-box"/>
  <text x="536" y="156" class="d-title">PWA</text>
  <text x="536" y="176" class="d-muted">сайт с иконкой на экране</text>

  <rect x="520" y="222" width="240" height="38" rx="8" class="d-box"/>
  <text x="640" y="245" text-anchor="middle" class="d-muted">сайт в браузере</text>
  <path d="M640 260V306" class="d-line" marker-end="url(#fd-arrow)"/>
  <text x="648" y="287" class="d-small">«на экран»</text>
  <rect x="520" y="308" width="240" height="36" rx="8" class="d-box"/>
  <text x="640" y="330" text-anchor="middle" class="d-small">иконка на телефоне</text>
  <text x="520" y="380" class="d-good">без стора и модерации</text>
  <text x="520" y="400" class="d-bad">push на iPhone ограничен</text>
</svg>
