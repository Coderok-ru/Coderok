<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bots-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-acc"/></marker>
    <marker id="bots-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-head-good"/></marker>
  </defs>

  <!-- Каналы -->
  <text x="0" y="16" class="d-label">Каналы</text>
  <rect x="0" y="30" width="190" height="72" rx="10" class="d-box"/>
  <text x="16" y="56" class="d-title">Telegram</text>
  <text x="16" y="76" class="d-muted">бот + Mini App</text>
  <text x="16" y="92" class="d-small d-muted">тонкий адаптер</text>

  <rect x="0" y="122" width="190" height="72" rx="10" class="d-box"/>
  <text x="16" y="148" class="d-title">MAX</text>
  <text x="16" y="168" class="d-muted">бот + мини-приложение</text>
  <text x="16" y="184" class="d-small d-muted">тонкий адаптер</text>

  <rect x="0" y="214" width="190" height="72" rx="10" class="d-box"/>
  <text x="16" y="240" class="d-title">Сайт, приложение</text>
  <text x="16" y="260" class="d-muted">те же цены и статусы</text>

  <!-- каналы → ядро -->
  <path d="M190 58H270" class="d-line-acc" marker-end="url(#bots-arrow-acc)"/>
  <path d="M190 158H270" class="d-line-acc" marker-end="url(#bots-arrow-acc)"/>
  <path d="M190 250H270" class="d-line-acc" marker-end="url(#bots-arrow-acc)"/>
  <text x="230" y="50" text-anchor="middle" class="d-small d-acc">заказ</text>
  <text x="230" y="150" text-anchor="middle" class="d-small d-acc">заказ</text>
  <text x="230" y="242" text-anchor="middle" class="d-small d-acc">заказ</text>

  <!-- Ядро -->
  <rect x="272" y="30" width="200" height="256" rx="12" class="d-acc-box"/>
  <text x="290" y="56" class="d-label">Ядро</text>
  <text x="290" y="80" class="d-title">Один бэкенд</text>
  <text x="290" y="108">услуги и цены</text>
  <text x="290" y="132">свободные слоты</text>
  <text x="290" y="156">создание заказа</text>
  <text x="290" y="180">оплата: эквайринг</text>
  <text x="290" y="204">статусы</text>

  <!-- ядро → CRM -->
  <path d="M472 110H550" class="d-line-acc" marker-end="url(#bots-arrow-acc)"/>
  <text x="511" y="102" text-anchor="middle" class="d-small d-acc">пишет</text>

  <!-- CRM -->
  <rect x="552" y="30" width="208" height="160" rx="12" class="d-box"/>
  <text x="570" y="56" class="d-label">CRM</text>
  <text x="570" y="80" class="d-title">Заявка в системе</text>
  <text x="570" y="106" class="d-muted">без ручного переноса</text>
  <text x="570" y="134">принят → в работе</text>
  <text x="570" y="156">→ выполнен и оплачен</text>

  <!-- смена статуса → клиенту -->
  <path d="M656 190V326H95V288" class="d-line-good d-dash" marker-end="url(#bots-arrow-good)"/>
  <text x="664" y="236" class="d-small d-good">смена статуса</text>
  <text x="380" y="316" text-anchor="middle" class="d-small d-good">уведомление клиенту в тот мессенджер, откуда пришёл заказ</text>
</svg>
